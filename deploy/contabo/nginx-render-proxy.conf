# Include inside a location block. Contabo is the public domain's TLS edge;
# Render continues running the production application and its workers.
# Resolve at runtime so Render address changes do not require nginx reloads.
resolver 127.0.0.53 valid=300s ipv6=off;
resolver_timeout 5s;
set $uzdonate_render_upstream donate-app-5vhs.onrender.com;
# No URI component: preserve the original escaped path/query, or the normalized
# URI after an internal legal-page rewrite.
proxy_pass https://$uzdonate_render_upstream;
proxy_http_version 1.1;
proxy_set_header Host donate-app-5vhs.onrender.com;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
# Replace any client-supplied forwarding chain at this public edge.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Forwarded "";
# Render's HTTP/3 advertisement and HSTS scope belong to its own edge.
proxy_hide_header Alt-Svc;
proxy_hide_header Strict-Transport-Security;

proxy_ssl_server_name on;
proxy_ssl_name donate-app-5vhs.onrender.com;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 4;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_session_reuse on;

proxy_connect_timeout 15s;
proxy_send_timeout 120s;
# The free Render instance may take about 90 seconds to start after sleeping.
proxy_read_timeout 120s;
proxy_redirect https://donate-app-5vhs.onrender.com/ https://uzdonate.uz/;
