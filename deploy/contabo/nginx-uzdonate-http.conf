# Bootstrap only: install as /etc/nginx/sites-available/uzdonate.uz before
# certificate issuance, then replace with nginx-uzdonate-https.conf.
server {
    listen 80;
    listen [::]:80;
    server_name uzdonate.uz www.uzdonate.uz;

    access_log /var/log/nginx/uzdonate-access.log;
    error_log /var/log/nginx/uzdonate-error.log warn;
    client_max_body_size 10m;
    client_body_timeout 60s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "UZDONATE tez orada shu manzilda. Iltimos, birozdan so'ng qayta urinib ko'ring.\n";
    }
}
