server {
    listen 80;
    listen [::]:80;
    server_name uzdonate.uz www.uzdonate.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://uzdonate.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.uzdonate.uz;

    ssl_certificate /etc/letsencrypt/live/uzdonate.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzdonate.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    return 308 https://uzdonate.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name uzdonate.uz;

    ssl_certificate /etc/letsencrypt/live/uzdonate.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uzdonate.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:UZDONATESSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/uzdonate-access.log;
    error_log /var/log/nginx/uzdonate-error.log warn;
    # The largest receipt route accepts 7.5 MB JSON with a base64 image.
    client_max_body_size 10m;
    client_body_timeout 60s;

    location = /privacy.html { rewrite ^ /webapp/privacy.html last; }
    location = /privacy { rewrite ^ /webapp/privacy.html last; }
    location = /terms.html { rewrite ^ /webapp/terms.html last; }
    location = /terms { rewrite ^ /webapp/terms.html last; }

    location / {
        include /etc/nginx/snippets/uzdonate-local-proxy.conf;
    }
}
