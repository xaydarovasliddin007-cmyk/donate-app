services:
  - type: web
    name: donate-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_ACCESS_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://donate-app-5vhs.onrender.com,https://uzdonate.uz
      - key: PUBLIC_APP_URL
        value: https://uzdonate.uz
      - key: GOOGLE_CLIENT_ID
        value: 223785346997-vphv1k7i131r72orkhj05dnvvhocd9br.apps.googleusercontent.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: CARD_TRANSACTION_WEBHOOK_SECRET
        generateValue: true
