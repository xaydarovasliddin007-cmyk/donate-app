name: donate_app
description: "UZDONATE — fast, premium gaming top-up platform."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.2.1
  go_router: ^17.4.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  intl: 0.20.2
  permission_handler: ^13.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/icons/
    - assets/payment_logos/

# Shared UD monogram in ink, azure and ice cyan, matching the web and bot.
# Regenerate native launcher assets after updating the source artwork.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon_full.png"
  adaptive_icon_background: "assets/branding/app_icon_bg.png"
  adaptive_icon_foreground: "assets/branding/app_icon_fg.png"
  min_sdk_android: 21

# The native splash and Flutter BrandMark use the same shared UD artwork.
flutter_native_splash:
  color: "#F5F8FF"
  color_dark: "#0A0D15"
  image: assets/branding/splash_logo.png
  image_dark: assets/branding/splash_logo.png
  android_12:
    color: "#F5F8FF"
    color_dark: "#0A0D15"
    image: assets/branding/splash_logo.png
    image_dark: assets/branding/splash_logo.png
    icon_background_color: "#F5F8FF"
    icon_background_color_dark: "#0A0D15"
