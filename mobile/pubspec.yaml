name: donate_app
description: "UZDONATE — fast, premium gaming top-up platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  flutter_svg: ^2.2.1
  go_router: ^17.4.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  intl: 0.20.2
  permission_handler: ^13.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/icons/
    - assets/payment_logos/

# The actual app icon (home screen + Play Store listing) — was still
# Flutter's stock default logo before this, since no image-editing tool was
# available to hand-author real icon PNGs at every required density. Reuses
# the same brand mark flutter_native_splash already uses below, generated
# into every density (legacy) plus a proper adaptive icon (foreground +
# solid background) for Android 8+. Run `flutter pub run
# flutter_launcher_icons` after changing this — it's a generation step, not
# something that runs automatically on build.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/splash_logo.png"
  adaptive_icon_background: "#146CFF"
  adaptive_icon_foreground: "assets/branding/splash_logo.png"
  min_sdk_android: 21

# Native (pre-Flutter-engine) splash — this is what's actually on screen for
# most of cold start, since it's shown by the OS before the Flutter engine
# has even loaded. `splash_logo.png` mirrors BrandMark's gradient+bolt mark
# exactly (same colors, same path geometry) so there's no visual seam when
# Flutter's first frame (with the real animated BrandMark) takes over.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F1115"
  image: assets/branding/splash_logo.png
  image_dark: assets/branding/splash_logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F1115"
    image: assets/branding/splash_logo.png
    image_dark: assets/branding/splash_logo.png
    # Android 12+ constrains the icon to a masked safe zone — keep it modest
    # relative to the canvas (our mark already only fills the center ~47%)
    # rather than fighting the OS clip.
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#0F1115"
