services:
  postgres:
    image: postgres:16-alpine
    container_name: donate_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: donate
      POSTGRES_PASSWORD: donate
      POSTGRES_DB: donate_app
    ports:
      - '5432:5432'
    volumes:
      - donate_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U donate -d donate_app']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: donate_app_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides the .env value (which points at localhost:5432 for
      # running the backend directly on the host) — inside the compose
      # network, Postgres is reachable at its service name instead.
      DATABASE_URL: postgresql://donate:donate@postgres:5432/donate_app?schema=public
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      # Shadows the bind mount above so the container's own Linux-built
      # node_modules (with a real argon2 binary) is used instead of
      # whatever is on the Windows host — the entire reason this service
      # exists is to run outside the host's native-binary restrictions.
      - donate_app_backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  humo-listener:
    build:
      context: ./backend
    container_name: donate_app_humo_listener
    # Card-transfer auto-verification depends entirely on this process
    # staying up — without restart:unless-stopped it was only ever running
    # in a manually-opened terminal, so any crash/reboot/network blip
    # silently reverted every card-transfer top-up to manual-only review
    # with nobody notified.
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # "localhost" would mean this container's own loopback, not backend's
      # — same reasoning as the backend service's DATABASE_URL override.
      HUMO_WEBHOOK_URL: http://backend:4000/api/v1/payments/webhooks/humo-transaction
    volumes:
      - ./backend:/app
      - donate_app_backend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    command: ['npx', 'tsx', 'scripts/humo-listener.ts']

volumes:
  donate_app_postgres_data:
  donate_app_backend_node_modules:
