services:
  postgres:
    image: postgres:16-alpine
    container_name: donate_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: donate
      POSTGRES_PASSWORD: donate
      POSTGRES_DB: donate_app
    ports:
      - '5432:5432'
    volumes:
      - donate_app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U donate -d donate_app']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  donate_app_postgres_data:
